<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Andrea's Adventskalender 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0b1928;
    --panel:#172b3e;
    --accent:#c47b4a; /* kupfer */
    --metal:#29445a;  /* nachtblau */
    --gold:#e0ad78;
    --shadow:rgba(0,0,0,0.32);
  }
  html,body{height:100%;margin:0;font-family:Roboto,system-ui,Segoe UI,Arial; background: radial-gradient(circle at top right, #203b52, var(--bg)); color:#f2e6d8; }
  .wrap{max-width:1100px;margin:24px auto;padding:28px;}
  header{display:flex;align-items:center;gap:18px}
  .title{
    font-size:28px;color:var(--accent);font-weight:700;
  }
   .subtitle{color:#c5b6a8; font-size:14px;margin-top:6px}
  .frame{
    margin-top:18px;
    background:linear-gradient(145deg, #172e43, #0e2031);
    border-radius:18px;padding:28px; box-shadow: 0 6px 30px var(--shadow);
    border:1px solid rgba(196,123,74,0.48);
  }

  /* calendar grid */
  .calendar{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:14px;
    padding:18px;
  }
  @media (max-width:800px){ .calendar{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:480px){ .calendar{grid-template-columns:repeat(3,1fr);} }

  .door{
    position:relative;
    height:120px;
    background: linear-gradient(145deg,#31536b,#10283c);
    border-radius:10px;
    border: 1px solid rgba(212,145,94,0.75);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    cursor:pointer; perspective:900px;
    overflow:visible;
  }
  .door.locked{cursor:default; opacity:0.82; filter:grayscale(0.02);}

  /* number style (verschnörkelt) */
  .num{
    font-family:'Great Vibes', serif;
    font-size:46px;
    font-weight:700;
    color: #10283c;
    -webkit-text-stroke: 0.35px rgba(7,20,32,0.65);
    text-shadow: 0 1px 0 rgba(255,235,211,0.72), 0 2px 4px rgba(0,0,0,0.28);
  }

  /* inner door flap (for animation) */
  .flap{
    position:absolute; inset:6px; border-radius:8px;
    background: linear-gradient(145deg,#f0c49a,#b96f45 58%,#8d4f32);
    transform-origin:left center;
    transition: transform 600ms cubic-bezier(.2,.9,.2,1), box-shadow 400ms;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    border:1px solid rgba(255,220,185,0.72);
  }
  .door.open .flap{
    transform: rotateY(-140deg) translateX(-6px);
    box-shadow: 0 18px 40px rgba(10,20,40,0.18);
  }

  /* reveal panel (behind the flap) */
  .panel{
    position:absolute; inset:6px; border-radius:8px;
    background: linear-gradient(145deg, #1c354a, #102538);
    display:flex; align-items:center; justify-content:center;
    padding:10px; text-align:center;
    font-size:13px; color:#f3e5d7; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    border:1px dashed rgba(205,145,99,0.65);
  }

   .hint{font-size:13px;color:#c5b6a8; margin-top:8px}
  .countdown{font-weight:500;color:#ead7c5; margin-left:auto; text-align:right}

  /* modal */
  .modal{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(3,9,16,0.78); z-index:60;
  }
  .modal .box{
    width:min(720px,92%); background:var(--panel); border-radius:12px; padding:20px; box-shadow:0 14px 40px rgba(0,0,0,0.45);
    border:1px solid rgba(196,123,74,0.55);
  }
  .modal h3{margin:0 0 12px 0; color:var(--accent)}
  .modal p{margin:8px 0;color:#e6d8ca}
  .btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;margin:6px 6px 0 0;}
  .btn.secondary{background:#20384c;color:#f0c49a;border:1px solid rgba(196,123,74,0.55)}

  footer{margin-top:18px;color:#a99b8e;font-size:13px; text-align:center}
  .tiny{font-size:12px;color:#a99b8e}

  /* Sanfter Einblendeeffekt für den Text */
.fade-in {
  opacity: 0;
  transform: scale(0.95);
  animation: fadeIn 1.5s ease forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: scale(1);
  }
}
/* ❄ Schneeflocken-Stil */
#snowContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  pointer-events: none; /* nichts blockieren */
  z-index: 9999; /* über allem, aber nicht klick-blockierend */
}

.snowflake {
  position: absolute;
  top: -10px;
  color: #e8c09e; /* warmer Kupferschimmer */
  font-size: 1.2em;
  user-select: none;
  pointer-events: none;
  opacity: 0.85;
  animation: fall linear infinite, sway ease-in-out infinite;
  text-shadow:
    0 0 10px rgba(222, 160, 112, 0.55),
    0 0 20px rgba(222, 160, 112, 0.32),
    0 0 30px rgba(255, 255, 255, 0.4);
}

/* vertikaler Fall */
@keyframes fall {
  0% { transform: translateY(-10px); opacity: 1; }
  100% { transform: translateY(100vh); opacity: 0.3; }
}

/* leichtes Hin-und-Her-Schwingen */
@keyframes sway {
  0% { transform: translateX(0); }
  50% { transform: translateX(20px); }
  100% { transform: translateX(0); }
}

</style>

</head>
<body>
  <div class="wrap">
    <header>
      <div style="width:62px;height:62px;border-radius:12px;background:linear-gradient(135deg,#27445a,#102438);display:flex;align-items:center;justify-content:center;border:1px solid rgba(196,123,74,0.7);box-shadow:0 6px 18px rgba(0,0,0,0.28)">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.3 4.7L19 8l-3.4 2.6L16.6 15 12 12.7 7.4 15l1-4.4L5 8l4.7-1.3L12 2z" fill="#d08a58"/></svg>
      </div>
      <div>
        <div class="title">Andrea's Adventskalender 2026</div>
        <div class="subtitle">24 Days of Music – No Christmas Music Required. 🎸</div>
      </div>
      <div class="countdown" id="countdown"></div>
    </header>

    <div class="frame">
      <div class="calendar" id="calendar">
        <!-- 24 doors will be injected by JS -->
      </div>

      <div class="hint">Tipp: Die Türchen öffnen sich automatisch am jeweiligen Datum. Bereits geöffnete Türchen bleiben offen.</div>
    </div>

    <footer>
      <div class="tiny">© Andrea — Adventskalender 2026.</div> /*Platzhalter-Links können später geändert werden.*/
    </footer>
  </div>

  <!-- modal -->
  <div class="modal" id="modal">
    <div class="box">
      <h3 id="modalTitle">Tür</h3>
      <p id="modalBody">Inhalt</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <a id="openLink" class="btn" target="_blank" rel="noopener">Öffnen</a>
        <button id="closeBtn" class="btn secondary">Schließen</button>
      </div>
    </div>
  </div>

<script>
(function(){
  // config: placeholder links (change later easily)
  const placeholders = [
    "https://www.youtube.com/watch?v=-p6OH7FoWoQ", // Türchen 1: Les Miserables
    "https://www.youtube.com/watch?v=yeNHxg-ciDI&list=RDyeNHxg-ciDI&start_radio=1", // Türchen 2: Sportfreunde Stiller
    "https://www.youtube.com/watch?v=s6GKgqIxShQ&list=RDs6GKgqIxShQ&start_radio=1", // Türchen 3: Doro
    "https://www.youtube.com/watch?v=amedt5dpUoI&list=RDamedt5dpUoI&start_radio=1", // Türchen 4: Syml 
    "https://www.youtube.com/watch?v=17HRV8k1YMw&list=RD17HRV8k1YMw&start_radio=1", // Türchen 5: Metallica
    "https://www.youtube.com/watch?v=kK5O1rL0NwE&list=RDkK5O1rL0NwE&start_radio=1", // Türchen 6: BAP
    "https://www.youtube.com/watch?v=Yoh89mG2eZM&list=RDYoh89mG2eZM&start_radio=1", // Türchen 7: Die Toten Hosen
    "https://www.youtube.com/watch?v=ijxk-fgcg7c&list=RDijxk-fgcg7c&start_radio=1", // Türchen 8: The Cure
    "https://www.youtube.com/watch?v=IR8TJzFwBmk&list=RDIR8TJzFwBmk&start_radio=1", // Türchen 9: ASP
    "https://www.youtube.com/watch?v=JzIqHyIoKws&list=RDJzIqHyIoKws&start_radio=1", // Türchen 10: Peter Maffay
    "https://www.youtube.com/watch?v=JQU9uCJQ4fM&list=RDJQU9uCJQ4fM&start_radio=1", // Türchen 11: Ray Wilson
    "https://www.youtube.com/watch?v=c7cs5IMo14Q&list=RDc7cs5IMo14Q&start_radio=1", // Türchen 12: Queensryche
    "https://www.youtube.com/watch?v=dGO_sx4By28&list=RDdGO_sx4By28&start_radio=1", // Türchen 13: Dominum
    "https://www.youtube.com/watch?v=YaW-0PlmQUY&list=RDYaW-0PlmQUY&start_radio=1", // Türchen 14: Deep Purple
    "https://www.youtube.com/watch?v=QfHnuQ6mGkI", // Türchen 15: BAP
    "https://www.youtube.com/watch?v=DraA3PUuoQc&list=RDDraA3PUuoQc&start_radio=1", // Türchen 16: AnnenMayKantereit
    "https://www.youtube.com/watch?v=aRK3B2JpwWA&list=RDaRK3B2JpwWA&start_radio=1", // Türchen 17: Barclay James Harvest
    "https://www.youtube.com/watch?v=rXLPb3tFk0o&list=RDrXLPb3tFk0o&start_radio=1", // Türchen 18: Fischer-Z
    "https://www.youtube.com/watch?v=1YOovPkiMrk&list=RD1YOovPkiMrk&start_radio=1", // Türchen 19: Unheilig
    "https://www.youtube.com/watch?v=Ckom3gf57Yw&list=RDCkom3gf57Yw&start_radio=1", // Türchen 20: Metallica
    "https://www.youtube.com/watch?v=QsRh51QJHJg&list=RDQsRh51QJHJg&start_radio=1", // Türchen 21: Knorkator
    "https://www.youtube.com/watch?v=nJvlvB93j2I&list=RDnJvlvB93j2I&start_radio=1", // Türchen 22: Die Toten Hosen
    "https://www.youtube.com/watch?v=7s9_veooy9c&list=RD7s9_veooy9c&start_radio=1", // Türchen 23: The Australian Pink Floyd Show
    "https://www.youtube.com/watch?v=36_i2jf8p_I&list=RD36_i2jf8p_I&start_radio=1", // Türchen 24: Jeff Buckley
  ];

  const calendarEl = document.getElementById('calendar');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const openLink = document.getElementById('openLink');
  const closeBtn = document.getElementById('closeBtn');
  const countdownEl = document.getElementById('countdown');

  // target year & month:
  const YEAR = 2026;
  const MONTH = 11; // December: month index 11

  // create doors
  for(let i=1;i<=24;i++){
    const door = document.createElement('div');
    door.className = 'door';
    door.dataset.day = i;

    const flap = document.createElement('div');
    flap.className = 'flap';
    flap.innerHTML = '<div class="num">'+i+'</div>';

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = '<div>Tür '+i+'</div>';

    door.appendChild(panel);
    door.appendChild(flap);
    calendarEl.appendChild(door);
  }

  // helper: get status from storage
  function isOpened(day){
    return localStorage.getItem('advent_' + YEAR + '_opened_' + day) === '1';
  }

  function setOpened(day){
    localStorage.setItem('advent_' + YEAR + '_opened_' + day, '1');
  }

  // check date allowed
function isAllowed(day) {
    const now = new Date();
    const allowedDate = new Date(YEAR, MONTH, day, 0, 0, 0);
    return now >= allowedDate;
  }

  // build UI and update the countdown
  function refresh(){
    const doors = document.querySelectorAll('.door');

    doors.forEach(door => {
      const day = parseInt(door.dataset.day, 10);
      door.classList.remove('open', 'locked');

      // Date check comes first: an old saved state must never unlock a future door.
      if (!isAllowed(day)) {
        door.classList.add('locked');
      } else if (isOpened(day)) {
        door.classList.add('open');
      }
    });

    const now = new Date();
    const decemberFirst = new Date(YEAR, MONTH, 1, 0, 0, 0);

    if (now < decemberFirst) {
      const difference = decemberFirst - now;
      const days = Math.ceil(difference / (1000 * 60 * 60 * 24));
      countdownEl.innerHTML = `<div style="font-size:14px;color:#ead7c5">Noch ${days} Tag(e) bis 01.12.2026</div>`;
    } else {
      countdownEl.innerHTML = '<div style="font-size:14px;color:#ead7c5">Viel Spaß – öffne ein Türchen!</div>';
    }
  }

  refresh();

  // Update automatically at least once per minute (including midnight unlocks).
  setInterval(refresh, 60000);

  // Refresh when the browser tab becomes visible again.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh();
  });

  // door click handler
  calendarEl.addEventListener('click', e=>{
    const door = e.target.closest('.door');
    if(!door) return;
    const day = parseInt(door.dataset.day,10);

    if(!isAllowed(day)){
      // user clicked too early
      modalTitle.innerText = 'Noch nicht verfügbar';
      modalBody.innerText = 'Dieses Türchen kann erst am ' + new Date(YEAR, MONTH, day).toLocaleDateString() + ' geöffnet werden.';
      openLink.style.display = 'none';
      modal.style.display = 'flex';
      return;
    }

    // open door animation and show link
    if(!isOpened(day)){
      door.classList.add('open');
      setOpened(day);
    } else {
      door.classList.add('open');
    }

  // show modal with placeholder link
modalTitle.innerText = 'Tür ' + day;

// kleine festliche Zufallstexte 🎄
const festiveMessages = [
  '🔔<br>Klicke auf "Öffnen", um dein Geschenk zu entdecken!',
  '🎁<br>Eine kleine Überraschung wartet auf dich!',
  '✨<br>Lass dich überraschen – Frohe Vorweihnachtszeit!',
  '❄️<br>Ein Glöckchen klingt, ein Lichtlein brennt – öffne dein Türchen!',
  '🌟<br>Etwas Schönes verbirgt sich hinter diesem Türchen!'
];

// zufällige Nachricht auswählen
const randomMessage = festiveMessages[Math.floor(Math.random() * festiveMessages.length)];

// Glöckchensound abspielen 🔔
const bell = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_3d1c3b7c16.mp3?filename=small-bell-ding-1048.mp3');
bell.volume = 0.3; // leise und dezent
bell.play().catch(() => {}); // Fehler ignorieren, falls Browser blockiert

// Einblendeffekt per CSS aktivieren ✨
modalBody.innerHTML = `<div class="fade-in">${randomMessage}</div>`;

// Link anzeigen
openLink.href = placeholders[day-1] || '#';
openLink.style.display = 'inline-block';
modal.style.display = 'flex';

  });

  closeBtn.addEventListener('click', ()=>{ modal.style.display='none'; });

  // close modal on background click
  modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.style.display='none'; });

  // play soft bell chime periodically (very subtle)
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const masterGain = ctx.createGain();
    masterGain.gain.value = 0.06; // very quiet
    masterGain.connect(ctx.destination);

    function bell(time){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      // inharmonic bell-ish frequencies
      o.frequency.setValueAtTime(880, time);
      o.frequency.exponentialRampToValueAtTime(1320, time+0.3);
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.08, time+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, time+1.8);
      o.connect(g); g.connect(masterGain);
      o.start(time); o.stop(time+2.2);
    }

    function scheduleBells(){
      const now = ctx.currentTime;
      bell(now + 0.3);
      // schedule gentle repeating bells every ~8-12 seconds randomly to avoid loop monotony
      const nextDelay = 8 + Math.random()*6;
      setTimeout(scheduleBells, nextDelay*1000);
    }

    // resume context on first user interaction (autoplay policy)
    function startAudio(){
      if(ctx.state === 'suspended'){ ctx.resume(); }
      scheduleBells();
      window.removeEventListener('click', startAudio);
      window.removeEventListener('keydown', startAudio);
    }
    window.addEventListener('click', startAudio);
    window.addEventListener('keydown', startAudio);
  } catch(e){
    console.warn('Audio not supported', e);
  }
  
})();
  
</script>
<!-- Einziger Container -->
<!-- Schneeflocken Container direkt unter <body> -->
<div id="snowContainer"></div>

<style>
  /* Container fix über dem gesamten Bildschirm */
  #snowContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Klicks gehen durch */
    overflow: visible;
    z-index: 9999; /* Über allem */
  }

  .snowflake {
    position: absolute;
    top: -2em; /* Start leicht oberhalb */
    font-size: 1.2em;
    color: #d9a77e;
    user-select: none;
    pointer-events: none;
    animation-name: fall, sway, rotate;
    animation-timing-function: linear, ease-in-out, linear;
    animation-iteration-count: infinite, infinite, infinite;
  }

  @keyframes fall {
    0%   { transform: translateY(0); }
    100% { transform: translateY(110vh); } /* über volle Höhe */
  }

  @keyframes sway {
    0%   { transform: translateX(0); }
    50%  { transform: translateX(20px); }
    100% { transform: translateX(0); }
  }

  @keyframes rotate {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(180deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<script>
const snowContainer = document.getElementById('snowContainer');
const numFlakes = 50;

for(let i=0; i<numFlakes; i++){
  const flake = document.createElement('div');
  flake.className = 'snowflake';
  flake.textContent = '❄';

  flake.style.left = Math.random() * 100 + 'vw';
  flake.style.fontSize = (12 + Math.random()*18) + 'px';

  // Zufällige Animationsdauer & Delay
  const fallDuration = 5 + Math.random()*10;
  const swayDuration = 2 + Math.random()*3;
  const rotateDuration = 3 + Math.random()*3;
  const delay = Math.random() * 5;

  flake.style.animation = `fall ${fallDuration}s linear infinite ${delay}s, 
                           sway ${swayDuration}s ease-in-out infinite ${delay}s, 
                           rotate ${rotateDuration}s linear infinite ${delay}s`;

  snowContainer.appendChild(flake);
}
</script>

</body>
</html>
